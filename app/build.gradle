plugins {
    id 'java'
    id 'application'
}

group = 'scraper'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'scraper.CourseScraper'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Lets `./gradlew run` read from the terminal and keeps stdout clean for JSON output
tasks.named('run') {
    standardInput = System.in
}
